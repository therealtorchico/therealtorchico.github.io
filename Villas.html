<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Luxury Villas in Dubai | The Realtor Chico</title>
  <meta name="description" content="Explore selected luxury villas in Dubai with The Realtor Chico.">

  <style>
    body {
      margin: 0;
      background: #101010;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 28px 7%;
      border-bottom: 1px solid #333;
    }

    header a {
      color: #fff;
      text-decoration: none;
    }

    .intro {
      padding: 55px 7% 25px;
    }

    .intro h1 {
      font-size: 38px;
    }

    .intro p {
      color: #aaa;
    }

    .properties {
      padding: 20px 7% 70px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .property {
      background: #1b1b1b;
      border: 1px solid #333;
      overflow: hidden;
      border-radius: 4px;
    }

    .main-image {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
    }

    .gallery {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 12px 15px;
      scrollbar-width: thin;
      scrollbar-color: #777 #222;
    }

    .gallery img {
      width: 110px;
      height: 80px;
      object-fit: cover;
      flex-shrink: 0;
      border-radius: 3px;
      cursor: pointer;
    }

    .details {
      padding: 18px;
    }

    .details h2 {
      font-size: 20px;
      margin-top: 0;
    }

    .details p {
      color: #aaa;
      line-height: 1.6;
      margin: 9px 0;
    }

    .price {
      color: #d6bd91 !important;
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      color: #d6bd91;
      border: 1px solid #665b45;
      padding: 5px 10px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .description {
      white-space: pre-line;
      margin-top: 15px !important;
    }

    .whatsapp-button {
      display: block;
      text-align: center;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      padding: 13px 12px;
      margin-top: 18px;
      font-weight: bold;
      border-radius: 4px;
    }

    .whatsapp-button:hover {
      background: #1ebe5d;
    }

    .empty {
      color: #aaa;
      grid-column: 1 / -1;
    }

    @media (max-width: 600px) {
      .intro h1 {
        font-size: 30px;
      }

      .properties {
        grid-template-columns: 1fr;
      }

      .main-image {
        height: 220px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html">← THE REALTOR CHICO</a>
</header>

<section class="intro">
  <h1>Villas</h1>
  <p>Discover distinctive homes and premium communities across Dubai.</p>
</section>

<section class="properties" id="properties">
  <p class="empty">Loading properties...</p>
</section>

<script>

async function loadVillas() {

  const container = document.getElementById("properties");

  try {

    const response = await fetch(
      "https://api.github.com/repos/therealtorchico/therealtorchico.github.io/contents/properties/listings"
    );

    if (!response.ok) {
      throw new Error("Could not load listings");
    }

    const files = await response.json();

    const listings = files.filter(file =>
      file.name.endsWith(".json")
    );

    const results = await Promise.all(
      listings.map(async file => {
        const res = await fetch(file.download_url);

        if (!res.ok) {
          throw new Error("Could not load property file");
        }

        return res.json();
      })
    );

    const villas = results.filter(property =>
      property.website_section === "Stunning Villas"
    );

    container.innerHTML = "";

    if (!villas.length) {
      container.innerHTML =
        '<p class="empty">New villa listings coming soon.</p>';
      return;
    }

    villas.forEach(property => {

      const card = document.createElement("article");
      card.className = "property";

      const image = property.cover_image || "";

      const galleryImages = Array.isArray(property.gallery)
        ? property.gallery
        : [];

      const status = property.status || "Available";

      const whatsappMessage =
        "Hello, I am interested in " +
        (property.title || "this property") +
        ". Please share more details.";

      const whatsappLink =
        "https://wa.me/971501234567?text=" +
        encodeURIComponent(whatsappMessage);

      card.innerHTML = `

        <img
          class="main-image"
          src="${image}"
          alt="${property.title || "Property"}"
        >

        <div class="gallery">

          ${galleryImages.map((galleryImage, index) => `
            <img
              src="${galleryImage}"
              alt="Property photo ${index + 1}"
              loading="lazy"
              onclick="this.closest('.property').querySelector('.main-image').src=this.src"
            >
          `).join("")}

        </div>

        <div class="details">

          <span class="status">${status}</span>

          <h2>${property.title || ""}</h2>

          <p>${property.location || ""}</p>

          <p class="price">${property.price || ""}</p>

          <p><strong>Bedrooms:</strong> ${property.bedrooms || "N/A"}</p>

          <p><strong>Bathrooms:</strong> ${property.bathrooms || "N/A"}</p>

          <p><strong>Size:</strong> ${property.size || "N/A"}</p>

          <p class="description">
            ${property.description || ""}
          </p>

          <a
            class="whatsapp-button"
            href="${whatsappLink}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Enquire Now on WhatsApp
          </a>

        </div>
      `;

      container.appendChild(card);

    });

  } catch (error) {

    container.innerHTML =
      '<p class="empty">Properties could not be loaded. Please try again later.</p>';

    console.error(error);

  }

}

loadVillas();

</script>

</body>
</html>
