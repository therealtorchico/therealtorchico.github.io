media:
  input: images
  output: /images

content:
  - name: listings
    label: Property Listings
    type: collection
    path: properties/listings
    format: json
    filename: "{slug}.json"
    fields:
      - name: title
        label: Property Title
        type: string
        required: true

      - name: slug
        label: URL Slug
        type: string
        required: true

      - name: category
        label: Property Type
        type: select
        options:
          values:
            - Sale
            - Rent
            - Off-plan
            - Secondary market
            - Land and plots
            - Buildings, hotels and commercial

      - name: website_section
        label: Website Section
        type: select
        required: true
        options:
          values:
            - Stunning Villas
            - Townhouses
            - Off-Plan
            - Plots & Commercial

      - name: location
        label: Location
        type: string

      - name: community
        label: Community
        type: string

      - name: price
        label: Price
        type: string

      - name: bedrooms
        label: Bedrooms
        type: string

      - name: bathrooms
        label: Bathrooms
        type: string

      - name: size
        label: Size
        type: string

      - name: description
        label: Description
        type: text

      - name: cover_image
        label: Cover Image
        type: image

      - name: gallery
        label: Gallery Images
        type: image
        list: true

      - name: status
        label: Listing Status
        type: select
        options:
          values:
            - Available
            - Reserved
            - Sold
            - Rented

      - name: featured
        label: Featured Property
        type: boolean
